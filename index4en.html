<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=4.0, user-scalable=yes" />
  <title>Encountering Birds in Xiamen · Xiamen Birding Map</title>
  <style>
    :root {
      --page-bg: #edf4f9;
      --header-grad-top: #d6e8f5;
      --header-border: #b5cfe3;
      --card-bg: #ffffff;
      --ink-dark: #183045;
      --ink-muted: #4b657d;
      --accent-main: #1b6592;
      --accent-red: #d93025;
      --border-color: #cbddec;
      --frame-border: #9bc0dc;
      --toolbar-border: #b0cce3;
      --thead-bg: #dfeef8;
      --row-hover: #f2f8fc;
      --chip-bg: #ebf5f0;
      --chip-text: #1f6349;
      --chip-border: #c0dfd0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--page-bg);
      color: var(--ink-dark);
      font-family: "PingFang SC", "Hiragino Sans GB", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.62;
      padding-bottom: 54px;
    }

    .handbook-header {
      max-width: 920px;
      margin: 0 auto;
      padding: 18px 18px 16px;
      border-bottom: 2px solid var(--header-border);
      background: linear-gradient(180deg, var(--header-grad-top) 0%, var(--page-bg) 100%);
    }
    .badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .org-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--accent-main);
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      padding: 4px 11px;
      border-radius: 6px;
      letter-spacing: 0.4px;
    }
    .lang-switch {
      display: inline-flex;
      background: #d7e7f4;
      border: 1px solid #9bc0dc;
      border-radius: 20px;
      padding: 2px;
      gap: 2px;
      flex-shrink: 0;
    }
    .lang-btn {
      border: none;
      background: transparent;
      color: var(--ink-muted);
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.18s;
    }
    .lang-btn.active {
      background: var(--accent-main);
      color: #ffffff;
      box-shadow: 0 1px 4px rgba(27, 101, 146, 0.3);
    }

    .handbook-title {
      font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
      font-size: 25px;
      font-weight: 800;
      color: var(--ink-dark);
      letter-spacing: 0.8px;
      margin-bottom: 10px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 7px 10px;
      text-align: center;
    }
    .stat-num {
      font-size: 17px;
      font-weight: 800;
      color: var(--accent-main);
      line-height: 1.25;
    }
    .stat-label {
      font-size: 11.5px;
      color: var(--ink-muted);
      margin-top: 2px;
    }
    .handbook-lead {
      font-size: 13.8px;
      color: var(--ink-dark);
      opacity: 0.92;
      text-align: justify;
    }
    .handbook-lead p + p {
      margin-top: 6px;
    }

    /* Overview Map Image + Interactive SVG Hotspot Overlay */
    .map-section {
      max-width: 920px;
      margin: 14px auto 0;
      padding: 0 14px;
    }
    .map-frame {
      position: relative;
      width: 100%;
      border: 2px solid var(--frame-border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 20px rgba(30, 45, 55, 0.09);
      background: #ffffff;
    }
    .overview-img-stage {
      position: relative;
      width: 100%;
      line-height: 0;
      background: #f5f2e9;
    }
    .overview-map-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }
    .overview-hotspots-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 5;
    }
    .overview-hotspot {
      cursor: pointer;
      outline: none;
    }
    .overview-hotspot .hotspot-hit {
      fill: rgba(217, 48, 37, 0.001);
      stroke: none;
    }
    .overview-hotspot .hotspot-ring {
      fill: rgba(255, 235, 59, 0.01);
      stroke: #ff9800;
      stroke-width: 4px;
      opacity: 0;
      transition: all 0.2s ease;
    }
    .overview-hotspot .hotspot-pulse {
      fill: none;
      stroke: #d93025;
      stroke-width: 4px;
      opacity: 0;
      transform-origin: center;
      transform-box: fill-box;
    }
    .overview-hotspot .legend-hit {
      fill: rgba(217, 48, 37, 0.001);
      stroke: transparent;
      stroke-width: 2.5px;
      transition: all 0.18s ease;
    }
    .overview-hotspot:hover .hotspot-ring,
    .overview-hotspot.active .hotspot-ring {
      fill: rgba(255, 221, 87, 0.34);
      stroke: #ff9800;
      stroke-width: 5px;
      stroke-dasharray: none;
      opacity: 1;
    }
    .overview-hotspot:hover .legend-hit,
    .overview-hotspot.active .legend-hit {
      fill: rgba(255, 235, 59, 0.22);
      stroke: #d93025;
    }
    .overview-hotspot.active .hotspot-pulse {
      opacity: 1;
      animation: hotspotPulseAnim 1.5s infinite ease-out;
    }
    @keyframes hotspotPulseAnim {
      0% { transform: scale(0.9); opacity: 0.95; }
      100% { transform: scale(2.15); opacity: 0; }
    }

    .map-hint-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 14px;
      background: rgba(255, 253, 248, 0.96);
      border-top: 1px solid var(--border-color);
      font-size: 12.5px;
      color: var(--ink-dark);
    }
    .zoom-img-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #ebf4fb;
      color: var(--accent-main);
      border: 1px solid #a9cbe4;
      border-radius: 6px;
      padding: 3.5px 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .zoom-img-btn:hover {
      background: var(--accent-main);
      color: #ffffff;
    }

    /* Table / List Section */
    .table-section {
      max-width: 920px;
      margin: 18px auto 0;
      padding: 0 14px;
    }
    .section-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .section-title {
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 19px;
      font-weight: 800;
      color: var(--ink-dark);
    }
    .filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .filter-pill {
      border: 1px solid var(--toolbar-border);
      background: var(--card-bg);
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 4.5px 11px;
      border-radius: 16px;
      cursor: pointer;
    }
    .filter-pill.active {
      background: var(--accent-main);
      color: #fff;
      border-color: var(--accent-main);
    }

    .table-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 10px rgba(0,0,0,0.04);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13.5px;
    }
    thead {
      background: var(--thead-bg);
      color: var(--ink-dark);
      text-align: left;
    }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }
    tbody tr {
      cursor: pointer;
      transition: background 0.15s;
    }
    tbody tr:hover { background: var(--row-hover); }
    tbody tr.active-row { background: #fff3d6; }
    .num-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      color: #fff;
      font-weight: 700;
      font-size: 12.5px;
    }
    .spot-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .spot-link {
      color: #1c4e63;
      font-weight: 700;
      font-size: 15px;
    }
    .row-arrow {
      color: var(--ink-muted);
      font-size: 17px;
      font-weight: 700;
      opacity: 0.45;
      flex-shrink: 0;
    }
    .spot-submeta {
      font-size: 12.5px;
      color: var(--ink-muted);
      margin-top: 3px;
    }
    .mobile-birds-wrap {
      display: none;
      margin-top: 7px;
    }
    .bird-chip {
      display: inline-block;
      background: var(--chip-bg);
      color: var(--chip-text);
      border: 1px solid var(--chip-border);
      border-radius: 4px;
      padding: 1.5px 7px;
      font-size: 12px;
      margin: 2px 4px 2px 0;
      white-space: nowrap;
    }
    .bird-chip.highlight-chip {
      background: #fff4e5;
      color: #9a3412;
      border-color: #f6cca2;
      font-weight: 600;
    }

    @media (max-width: 680px) {
      .handbook-title { font-size: 21px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      thead { display: none; }
      th.col-habitat, td.col-habitat,
      th.col-birds, td.col-birds {
        display: none;
      }
      td { padding: 13px 12px; }
      td.col-num {
        width: 42px;
        padding-right: 4px;
        vertical-align: top;
        padding-top: 15px;
      }
      .mobile-birds-wrap { display: block; }
    }

    /* Detail Sheet Modal */
    .card-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 28, 32, 0.48);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 90;
    }
    .card-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .spot-sheet {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translate(-50%, 105%);
      width: 100%;
      max-width: 740px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--card-bg);
      border-top: 4px solid var(--accent-red);
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,0.24);
      padding: 18px 18px 28px;
      transition: transform 0.28s cubic-bezier(0.2, 0.9, 0.3, 1);
      z-index: 100;
    }
    .spot-sheet.open {
      transform: translate(-50%, 0);
    }
    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .sheet-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .sheet-num {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent-red);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .sheet-title {
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 19.5px;
      font-weight: 800;
      color: var(--ink-dark);
    }
    .close-btn {
      border: 1px solid var(--border-color);
      background: var(--page-bg);
      color: var(--ink-muted);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .meta-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 12px;
    }
    .meta-tag {
      font-size: 12px;
      padding: 3.5px 9px;
      border-radius: 5px;
      background: var(--thead-bg);
      color: var(--ink-dark);
      font-weight: 600;
    }

    /* Official PNG Local Map Box inside Sheet */
    .local-map-box {
      border: 1.5px solid var(--frame-border);
      border-radius: 10px;
      overflow: hidden;
      background: #1d2d22;
      margin-bottom: 12px;
    }
    .local-map-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      padding: 7px 12px;
      background: #dfeef8;
      border-bottom: 1px solid var(--border-color);
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-dark);
    }
    .local-img-stage {
      position: relative;
      width: 100%;
      line-height: 0;
      background: #233329;
    }
    .local-spot-img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
    }
    .local-subspot-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .subspot-hit-link {
      pointer-events: auto;
      cursor: pointer;
    }
    .subspot-hit-circle {
      fill: rgba(255, 235, 59, 0.01);
      stroke: #ffeb3b;
      stroke-width: 3.5px;
      opacity: 0;
      transition: all 0.18s;
    }
    .subspot-hit-link:hover .subspot-hit-circle {
      fill: rgba(255, 235, 59, 0.32);
      stroke: #ffffff;
      stroke-width: 4px;
      stroke-dasharray: none;
      opacity: 1;
    }
    .subspots-bar {
      padding: 8px 11px;
      background: #f5f9fc;
      border-top: 1px solid var(--border-color);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .subspot-nav-pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: #1b6592;
      background: #ffffff;
      border: 1px solid #a9cbe4;
      border-radius: 15px;
      padding: 3px 10px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .subspot-nav-pill:hover {
      background: #1b6592;
      color: #ffffff;
    }

    .sheet-desc {
      font-size: 14px;
      color: var(--ink-dark);
      background: var(--page-bg);
      border-left: 3.5px solid var(--accent-main);
      padding: 10px 13px;
      border-radius: 0 8px 8px 0;
      margin-bottom: 12px;
      text-align: justify;
    }
    .sheet-desc p + p { margin-top: 7px; }

    .info-block {
      font-size: 13px;
      color: var(--ink-dark);
      margin-bottom: 9px;
      background: #f8fbfd;
      border: 1px solid #d9e8f4;
      padding: 8px 11px;
      border-radius: 7px;
    }
    .bird-group-row {
      margin-bottom: 7px;
    }
    .bird-group-label {
      font-size: 12.5px;
      font-weight: 700;
      color: var(--ink-muted);
      margin-right: 6px;
    }
    .sheet-tips {
      font-size: 13px;
      color: #5b4628;
      background: #fff6e0;
      border: 1px dashed #dfbe78;
      padding: 9px 12px;
      border-radius: 7px;
      margin-top: 10px;
    }
    .sheet-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }
    .btn-primary, .btn-amap {
      flex: 1;
      min-width: 140px;
      text-align: center;
      padding: 11px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: #1b6592; color: #ffffff; }
    .btn-amap { background: #2d6a4f; color: #ffffff; }

    /* Fullscreen Image Lightbox */
    .lightbox-modal {
      position: fixed;
      inset: 0;
      background: rgba(10, 16, 22, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 200;
    }
    .lightbox-modal.open {
      opacity: 1;
      pointer-events: auto;
    }
    .lightbox-img {
      max-width: 96vw;
      max-height: 84vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      background: #fff;
    }
    .lightbox-caption {
      margin-top: 10px;
      color: #e2eef8;
      font-size: 13.5px;
      font-weight: 600;
      text-align: center;
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 18px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.35);
      background: rgba(0,0,0,0.5);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
    }

    /* Editorial Credits Footer */
    .credits-section {
      max-width: 920px;
      margin: 22px auto 0;
      padding: 0 14px;
    }
    .credits-card {
      background: linear-gradient(180deg, #f7fbfe 0%, #ffffff 100%);
      border: 1px solid var(--border-color);
      border-top: 3px solid var(--accent-main);
      border-radius: 10px;
      padding: 16px 18px 14px;
      box-shadow: 0 3px 10px rgba(24, 48, 69, 0.04);
    }
    .credits-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 10px;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--border-color);
    }
    .credits-title {
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 15px;
      font-weight: 800;
      color: var(--ink-dark);
      letter-spacing: 0.5px;
    }
    .credits-sub {
      font-size: 12px;
      color: var(--ink-muted);
    }
    .credits-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }
    .credit-group {
      background: rgba(237, 244, 249, 0.65);
      border: 1px solid #d7e7f4;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .credit-role {
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-muted);
      margin-bottom: 7px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .credit-people {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }
    .author-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #ffffff;
      border: 1px solid #c5dced;
      border-radius: 6px;
      padding: 3.5px 9px;
      font-size: 13px;
      color: var(--ink-dark);
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .author-name {
      font-weight: 700;
    }
    .author-nick {
      font-size: 11.5px;
      font-weight: 600;
      color: #1f6349;
      background: #ebf5f0;
      border: 1px solid #c0dfd0;
      border-radius: 4px;
      padding: 0.5px 6px;
    }
    @media (max-width: 680px) {
      .credits-grid {
        grid-template-columns: 1fr;
        gap: 8px;
      }
    }
  </style>
</head>
<body>

  <header class="handbook-header">
    <div class="badge-row">
      <span class="org-badge" id="orgBadgeText"></span>
      <div class="lang-switch" role="tablist" aria-label="Language Switch">
        <button class="lang-btn" id="btnLangZh" onclick="setLanguage('zh')">中文</button>
        <button class="lang-btn" id="btnLangEn" onclick="setLanguage('en')">EN</button>
      </div>
    </div>
    <h1 class="handbook-title" id="mainTitleText"></h1>
    <div class="stats-grid" id="statsGrid"></div>
    <div class="handbook-lead" id="introLead"></div>
  </header>

  <main id="mainOverview">
    <section class="map-section">
      <div class="map-frame">
        <div class="overview-img-stage">
          <img id="overviewMapImg" class="overview-map-img" src="assets_1110/overview_en.png" alt="Encountering Birds in Xiamen · Xiamen Birding Map" width="1968" height="1901" />
          <svg id="overviewHotspotsSvg" class="overview-hotspots-svg" viewBox="0 0 1968 1901" xmlns="http://www.w3.org/2000/svg">
            <g class="overview-hotspot" data-id="1" tabindex="0" role="button" aria-label="① 思明区筼筜湖西堤纳潮闸口" onclick="selectSpot(1)">
              <circle class="hotspot-pulse" cx="753.0" cy="1505.5" r="26" />
              <circle class="hotspot-ring" cx="753.0" cy="1505.5" r="22" />
              <circle class="hotspot-hit" cx="753.0" cy="1505.5" r="44" />
              <rect class="legend-hit" x="1488" y="1383" width="452" height="44" rx="8" ry="8" />
            </g>
            <g class="overview-hotspot" data-id="2" tabindex="0" role="button" aria-label="② 思明区东坪山公园" onclick="selectSpot(2)">
              <circle class="hotspot-pulse" cx="928.3" cy="1512.0" r="26" />
              <circle class="hotspot-ring" cx="928.3" cy="1512.0" r="22" />
              <circle class="hotspot-hit" cx="928.3" cy="1512.0" r="44" />

  <script>
    const INTRO = {"org_zh": "🐦 厦门市观鸟协会 · 观鸟导览", "org_en": "🐦 Xiamen BirdWatching Society · Birding Guide", "title_zh": "在厦门，与鸟相遇 · 厦门全域观鸟地图", "title_en": "Encountering Birds in Xiamen · Xiamen Birding Map", "stats_zh": [{"num": "471 种", "label": "累计记录鸟类 (截至2026.10.31)"}, {"num": "14 种", "label": "国家一级重点保护鸟类"}, {"num": "86 种", "label": "国家二级重点保护鸟类"}, {"num": "27 种", "label": "IUCN 易危(VU)以上受胁物种"}], "stats_en": [{"num": "471", "label": "Recorded Species (as of Oct 2026)"}, {"num": "14", "label": "China Class I Protected Species"}, {"num": "86", "label": "China Class II Protected Species"}, {"num": "27", "label": "IUCN Threatened Species (VU+)"}], "paragraphs_zh": ["厦门位于中国福建省东南沿海、台湾海峡西岸。这里山海相依，海湾、滩涂、湿地、山林与城市公园共同构成了丰富的鸟类家园。地处东亚—澳大利西亚候鸟迁飞路线，既是许多留鸟的家园，也是候鸟迁徙途中停歇、补充能量和越冬的场所。从水岸边的白鹭，到滩涂上觅食的鸻鹬，再到林间穿梭的小鸟，鸟类的身影融入了这座城市的日常。", "厦门下辖思明、湖里、集美、海沧、同安、翔安六个行政区，各有不同的观鸟风景。以厦门岛为主体的思明、湖里两区，城市公园和林地是观察留鸟、寻找迁徙林鸟的好去处；集美、海沧的湿地与开阔水域，吸引鹭鸟栖息，也迎来越冬的鸬鹚等水鸟；翔安的滨海滩涂，为迁徙和越冬的鸻鹬类提供觅食与停歇之地；同安、海沧的山林，则为探索丰富的林鸟世界提供了另一种选择。本篇按厦门岛（思明·湖里）、海沧、集美、同安、翔安五大区域，带你认识厦门不同的观鸟风景。"], "paragraphs_en": ["Xiamen lies on the southeastern coast of Fujian Province, China, along the western shore of the Taiwan Strait. Here, mountains meet the sea. Bays, tidal flats, wetlands, wooded hills and city parks provide a rich variety of habitats for birds. Located on the East Asian–Australasian Flyway, Xiamen is home to many resident birds and offers migratory species places to rest, refuel and spend the winter. From egrets along the waterfront and shorebirds feeding on the mudflats to small birds moving through the trees, birds are part of everyday life in this city.", "Xiamen has six administrative districts: Siming, Huli, Jimei, Haicang, Tong'an and Xiang'an, each with its own birding appeal. Organized into five areas—Xiamen Island (Siming and Huli), Haicang, Jimei, Tong'an and Xiang'an—this guide introduces the habitats and birds of each, inviting you to discover Xiamen's varied birding landscapes."]};
    const SPOTS = [{"id": 1, "num": "①", "area_key": "island", "habitat_tag": "wetland", "lon": 118.074864, "lat": 24.478322, "gcj_lon": 118.079836, "gcj_lat": 24.475665, "overview_px": [753.0, 1505.5], "district_zh": "思明区", "district_en": "Siming District", "name_zh": "思明区筼筜湖西堤纳潮闸口", "name_en": "Yundang Lake Xidi Tidal Sluice", "short_zh": "筼筜湖西堤纳潮闸口", "short_en": "Yundang Lake Sluice", "habitat_zh": "城市泻湖 / 纳潮闸口", "habitat_en": "Urban Lagoon & Tidal Sluice", "duration_zh": "约 2—3 小时（建议开闸前提前到场）", "duration_en": "About 2–3 hours (arrive before sluice opens)", "months_zh": "4月—11月初", "months_en": "April to early November", "difficulty_stars": "★☆☆☆☆", "difficulty_zh": "★☆☆☆☆　公共交通方便，潮汐广场和观鸟长廊步行轻松，周边便于补给。", "difficulty_en": "★☆☆☆☆ (1/5) Public transport is convenient, walking around Tidal Square and the birdwatching walkway is easy, and supplies are available nearby.", "summary_zh": "开闸纳潮时海水裹挟鱼群涌入湖中，成群白鹭悬停俯冲捕鱼，可在潮汐广场近距离观赏“鱼口夺食”。", "summary_en": "When seawater flows in through the sluice, flocks of egrets hover and dive for fish right beside Tidal Square.", "desc_zh": ["筼筜湖位于厦门岛西南部，原为与西海域相连通的筼筜港，后建西堤成封闭内湖，1988年为改善筼筜湖水质，提升水体交换能力，修建西堤纳潮闸口。开闸前，成群鹭鸟停在湖面的停鸟桩上等候，开闸纳潮时，海水裹挟鱼群涌入湖中，白鹭等鹭鸟随之聚集，在闸口上空悬停、俯冲捕鱼。站在潮汐广场或观鸟长廊，便能在不惊扰鸟类的情况下，欣赏“鱼口夺食”的生动场景。"], "desc_en": ["Yundang Lake lies in southwestern Xiamen Island. It was once Yundang Harbour, connected to the western sea, before the construction of the Xidi embankment enclosed it as a lake. The tidal sluice was built in 1988 to improve water quality by increasing exchange with the sea. Before the sluice opens, flocks of egrets wait on perches in the lake. When seawater flows in, it carries fish into the lake, drawing egrets to hover and dive for them above the sluice. From Tidal Square or the birdwatching walkway, visitors can enjoy this lively scene without disturbing the birds."], "transport_zh": "导航至“筼筜湖潮汐广场”或“筼筜湖观鸟长廊”；乘公交至海湾公园站，或乘地铁2号线至建业路站，再步行前往。自驾可选择海湾公园停车场或筼筜路沿线合法停车泊位。周边车位有限，建议优先乘坐公共交通。", "transport_en": "Navigate to ‘Yundang Lake Tidal Square’ or ‘Yundang Lake Birdwatching Walkway’. Take a bus to the Haiwan Park bus stop, or take Metro Line 2 to Jianye Road Station; then walk to the sluice. Drivers can use the Haiwan Park car park or legal parking spaces along Yundang Road. Spaces are limited, so public transport is recommended.", "key_birds_zh": ["白鹭", "大白鹭", "夜鹭", "池鹭"], "key_birds_en": ["Little Egret", "Great Egret", "Black-crowned Night Heron", "Chinese Pond Heron"], "bird_groups_zh": [{"label": "常见留鸟", "items": ["白鹭", "夜鹭", "池鹭"]}, {"label": "常见冬候鸟", "items": ["大白鹭"]}], "bird_groups_en": [{"label": "Common residents", "items": ["Little Egret", "Black-crowned Night Heron", "Chinese Pond Heron"]}, {"label": "Common winter visitors", "items": ["Great Egret"]}], "tips_zh": "出发前可在“筼筜湖”微信公众号的“今明纳排”栏目查询每日开闸时间。农历初一、十五前后的大潮期，潮差较大，鱼虾随水流进入湖区，值得重点关注。观察时请保持安静，不投喂或驱赶鸟类。", "tips_en": "Check the ‘Jinming Napai’ (today's and tomorrow's sluice schedule) section of the ‘Yundang Lake’ WeChat account for daily opening times. Around the first and fifteenth days of the lunar month, spring tides produce a larger tidal range and bring more fish and shrimp into the lake. Keep quiet and do not feed or chase the birds.", "local_map": {"bbox": [118.06915, 24.47385, 118.08323, 24.48248], "scale_m": 100, "flag": {"lon": 118.0735, "lat": 24.4801, "zh": "思明区筼筜湖西堤纳潮闸口", "en": "Yundang Lake Xidi Tidal Sluice"}, "subspots": [{"lon": 118.074864, "lat": 24.478322, "gcj_lon": 118.079836, "gcj_lat": 24.475665, "zh": "潮汐广场", "en": "Tidal Plaza", "dx": 14, "dy": 5, "anchor": "start", "img_px": [476.5, 367.5]}], "roads": [{"pts": [[118.0725, 24.48], [118.0727, 24.4765], [118.0729, 24.474]], "zh": "西堤东路", "en": "Xidi E. Rd", "major": true}, {"pts": [[118.07, 24.4804], [118.0771, 24.4807], [118.083, 24.4812]], "zh": "湖滨北路", "en": "Hubin N. Rd", "major": true}], "water_areas": [], "green_areas": [], "landmarks": [{"lon": 118.0787, "lat": 24.481, "zh": "🚇 建业路站", "en": "🚇 Jianye Rd Sta.", "type": "metro"}, {"lon": 118.0717, "lat": 24.4759, "zh": "🌲 海湾公园", "en": "🌲 Haiwan Park", "type": "park"}, {"lon": 118.078, "lat": 24.4749, "zh": "筼筜湖", "en": "Yundang Lake", "type": "water"}]}}, {"id": 2, "num": "②", "area_key": "island", "habitat_tag": "forest", "lon": 118.138293, "lat": 24.472321, "gcj_lon": 118.143214, "gcj_lat": 24.469645, "overview_px": [928.3, 1512.0], "district_zh": "思明区", "district_en": "Siming District", "name_zh": "思明区东坪山公园", "name_en": "Dongping Mountain Park", "short_zh": "东坪山公园", "short_en": "Dongping Mtn Park", "habitat_zh": "城市山林 / 水库 / 观猛平台", "habitat_en": "Wooded Hills, Reservoir & Raptor Watchpoint", "duration_zh": "约 2—4 小时", "duration_en": "About 2–4 hours", "months_zh": "3—5月、9—11月（迁徙季）；夏季（蜂虎/杜鹃/三宝鸟）", "months_en": "Mar–May & Sep–Nov (migrants); Summer (Bee-eater & Cuckoos)", "difficulty_stars": "★★☆☆☆", "difficulty_zh": "★★☆☆☆　东山水库环线步道较平缓，前往龟石望顶则有连续上坡和部分台阶，需要一定体力。补给点主要集中在山间社区，建议自带足量饮水；夏季备好驱蚊用品。", "difficulty_en": "★★☆☆☆ (2/5) The path around Dongshan Reservoir is fairly level, but the route to Guishi Wangding has a sustained climb and some steps. Bring plenty of water and insect repellent in summer.", "summary_zh": "山林、水库和草地交错，东山水库适合寻访迁徙林鸟，视野开阔的龟石望顶是春秋观察迁徙猛禽和雨燕的胜地。", "summary_en": "Features Dongshan Reservoir for migrant forest birds and Guishi Wangding Viewing Platform for migrating raptors and swifts.", "desc_zh": ["东坪山位于厦门岛南部最高峰洪脊山脉中部，占地面积约4.5平方千米，公园保留较多样的山地生境，山林、水库和草地交错。东山水库及周边林地在迁徙季林鸟较多，曾记录紫寿带、暗灰鹃鵙、发冠卷尾等过境鸟。视野开阔的龟石望顶则是春秋观察迁徙猛禽和雨燕的好去处。夏季，还可留意栗喉蜂虎、红翅凤头鹃和三宝鸟。"], "desc_en": ["Dongping Mountain Park lies in the Hongji Mountain area of southern Xiamen Island. It covers approximately 4.5 square kilometres and retains a variety of mountain habitats, including woodland, a reservoir and grassland. Dongshan Reservoir and its surrounding woods attract forest birds during migration; Japanese Paradise Flycatcher, Black-winged Cuckooshrike and Hair-crested Drongo have been recorded here. The open views at Guishi Wangding make it a good place to watch migrating raptors and swifts in spring and autumn. In summer, look for Blue-tailed Bee-eater, Chestnut-winged Cuckoo and Oriental Dollarbird."], "transport_zh": "可分别导航至“东山水库”或“龟石望顶观景台”。乘东坪山客运专线至东山水库站或东坪山社站，可前往相应区域；也可自驾或打车。山上车位较少，周末及节假日建议尽早出发。", "transport_en": "Navigate to ‘Dongshan Reservoir’ or ‘Guishi Wangding Viewing Platform’. The Dongping Mountain shuttle bus serves the Dongshan Reservoir and Dongping Shan She bus stops; get off at the stop for your chosen area. Driving or taking a taxi is also possible. Parking on the mountain is limited; set off early on weekends and public holidays.", "key_birds_zh": ["紫针尾雨燕", "灰脸鵟鹰", "紫寿带", "栗喉蜂虎", "红翅凤头鹃"], "key_birds_en": ["Purple Needletail", "Grey-faced Buzzard", "Japanese Paradise Flycatcher", "Blue-tailed Bee-eater"], "bird_groups_zh": [{"label": "常见留鸟", "items": ["黑领噪鹛", "普通翠鸟", "白鹭", "白头鹎", "灰胸竹鸡"]}, {"label": "常见过境鸟", "items": ["赤腹鹰", "灰脸鵟鹰", "日本松雀鹰", "红脚隼", "凤头蜂鹰", "燕隼", "白腰雨燕", "白喉针尾雨燕", "紫寿带", "暗灰鹃鵙", "红喉歌鸲", "黑枕王鹟"]}, {"label": "夏候鸟", "items": ["栗喉蜂虎", "红翅凤头鹃", "三宝鸟"]}, {"label": "冬候鸟", "items": ["红胁蓝尾鸲", "北红尾鸲", "大白鹭"]}, {"label": "✨ 高光鸟种记录", "items": ["紫针尾雨燕", "灰喉针尾雨燕"], "highlight": true}], "bird_groups_en": [{"label": "Common residents", "items": ["Greater Necklaced Laughingthrush", "Common Kingfisher", "Little Egret", "Light-vented Bulbul", "Chinese Bamboo Partridge"]}, {"label": "Common passage migrants", "items": ["Chinese Sparrowhawk", "Grey-faced Buzzard", "Japanese Sparrowhawk", "Amur Falcon", "Crested Honey-buzzard", "Eurasian Hobby", "Pacific Swift", "White-throated Needletail", "Japanese Paradise Flycatcher", "Black-winged Cuckooshrike", "Siberian Rubythroat", "Black-naped Monarch"]}, {"label": "Summer visitors", "items": ["Blue-tailed Bee-eater", "Chestnut-winged Cuckoo", "Oriental Dollarbird"]}, {"label": "Winter visitors", "items": ["Red-flanked Bluetail", "Daurian Redstart", "Great Egret"]}, {"label": "✨ Notable records", "items": ["Purple Needletail", "Silver-backed Needletail"], "highlight": true}], "tips_zh": "东山水库环线适合清晨慢走听音找林鸟；春秋晴朗有风的上午（9:00—12:00）适合在龟石望顶观景台守候猛禽过境与雨燕群。", "tips_en": "Walk the Dongshan Reservoir loop in the early morning for forest migrants; visit Guishi Wangding Viewing Platform on clear, breezy spring and autumn mornings for migrating raptors and swifts.", "local_map": {"bbox": [118.1249, 24.4577, 118.1529, 24.4747], "scale_m": 200, "flag": {"lon": 118.1372, "lat": 24.4722, "zh": "思明区东坪山公园", "en": "Dongping Mountain Park"}, "subspots": [{"lon": 118.138293, "lat": 24.472321, "gcj_lon": 118.143214, "gcj_lat": 24.469645, "zh": "东山水库", "en": "Dongshan Reservoir", "dx": 14, "dy": 5, "anchor": "start", "img_px": [501.5, 176.5]}, {"lon": 118.1381, "lat": 24.461457, "gcj_lon": 118.14302, "gcj_lat": 24.458784, "zh": "龟石望顶观景台", "en": "Guishi Wangding Viewing Platform", "dx": 14, "dy": 5, "anchor": "start", "img_px": [571.5, 673.5]}], "roads": [{"pts": [[118.126, 24.4712], [118.135, 24.4735], [118.1415, 24.4745]], "zh": "文曾路 / 金鸡南路", "en": "Jinji S. Rd", "major": true}, {"pts": [[118.1445, 24.4745], [118.1455, 24.4655], [118.1462, 24.4585]], "zh": "云顶隧道", "en": "Yunding Tunnel", "major": true}], "water_areas": [], "green_areas": [], "landmarks": [{"lon": 118.1322, "lat": 24.4648, "zh": "▲ 碧岩山", "en": "▲ Biyan Hill", "type": "peak"}, {"lon": 118.1492, "lat": 24.4648, "zh": "▲ 云顶岩", "en": "▲ Yunding Rock", "type": "peak"}, {"lon": 118.1382, "lat": 24.4638, "zh": "大东山 (东坪山社)", "en": "Dadongshan Village", "type": "village"}]}}, {"id": 3, "num": "③", "area_key": "island", "habitat_tag": "coastal", "lon": 118.191878, "lat": 24.515622, "gcj_lon": 118.196673, "gcj_lat": 24.512845, "overview_px": [1095.9, 1365.4], "district_zh": "湖里区", "district_en": "Huli District", "name_zh": "湖里区五通浦口", "name_en": "Wutong Pukou", "short_zh": "五通浦口", "short_en": "Wutong Pukou", "habitat_zh": "海岸滩涂 / 沙滩 / 水塘 / 荒地", "habitat_en": "Coastal Mudflats, Beach, Ponds & Open Ground", "duration_zh": "约 2—3 小时（观水鸟宜提前查潮汐）", "duration_en": "About 2–3 hours (check tide tables in advance)", "months_zh": "3—5月、7—12月", "months_en": "March–May and July–December", "difficulty_stars": "★★☆☆☆", "difficulty_zh": "★★☆☆☆　沙滩与荒地可沿现有路径观察，部分地面不平；海滩缺少补给点，建议自带饮水。", "difficulty_en": "★★☆☆☆ (2/5) Existing paths provide access to viewpoints by the beach and rough ground, though some surfaces are uneven. Bring drinking water.", "summary_zh": "兼有滩涂、沙滩、水塘和荒地多元生境，春秋迁徙季鸟种多变，是一处颇有“开盲盒”乐趣的观鸟点。", "summary_en": "A mosaic of mudflats, beach, ponds and open ground offering exciting 'mystery box' migrant birding in spring and autumn.", "desc_zh": ["五通浦口社位于厦门岛湖里区东部海岸，历史上曾经是浅海洼地，周边有滩涂、沙滩、水塘和荒地等多种生境。滩涂与沙滩是鸻鹬类水鸟觅食、停歇的地方；水塘和荒地也吸引白胸翡翠、栗喉蜂虎、杜鹃科等鸟类。春秋迁徙季，来访鸟种多变，是一处颇有“开盲盒”乐趣的观鸟点。"], "desc_en": ["Pukou, a coastal neighbourhood in eastern Huli District on Xiamen Island, was once a shallow coastal depression. The surrounding mudflats, beach, ponds and open ground offer a range of habitats. Shorebirds feed and rest on the mudflats and beach, while the ponds and rough ground attract White-throated Kingfishers, Blue-tailed Bee-eaters and cuckoos. The changing mix of visitors in spring and autumn makes this a rewarding place to discover unexpected birds."], "transport_zh": "导航至“浦口瑞云宫”，建议自驾或打车前往；乘地铁2号线至两岸金融中心站后，也可按导航步行前往。", "transport_en": "Navigate to ‘Pukou Ruiyun Temple’. Driving or taking a taxi is recommended. For metro travel, get off at Cross-Strait Financial Center Station on Line 2 and follow a map app to walk from the metro station to Pukou.", "key_birds_zh": ["栗喉蜂虎", "铁嘴沙鸻", "红胸姬鹟", "黑冠鳽", "白斑军舰鸟"], "key_birds_en": ["Blue-tailed Bee-eater", "Greater Sand Plover", "Red-breasted Flycatcher", "Malayan Night Heron"], "bird_groups_zh": [{"label": "常见留鸟", "items": ["白鹭", "纯色山鹪莺", "黑翅鸢", "斑鱼狗", "褐翅鸦鹃"]}, {"label": "常见过境鸟", "items": ["爪哇金丝燕", "铁嘴沙鸻", "金鸻", "灰尾漂鹬", "灰纹鹟", "白眉姬鹟", "北灰鹟"]}, {"label": "夏候鸟", "items": ["栗喉蜂虎", "白脸鸻", "白额燕鸥", "黑卷尾", "八声杜鹃"]}, {"label": "冬候鸟", "items": ["普通鸬鹚", "鸻鹬类"]}, {"label": "✨ 高光鸟种记录", "items": ["黑冠鳽", "红胸姬鹟", "硫磺鹀", "遗鸥", "厚嘴苇莺", "白斑军舰鸟", "褐鲣鸟", "渔鸥"], "highlight": true}], "bird_groups_en": [{"label": "Common residents", "items": ["Little Egret", "Plain Prinia", "Black-winged Kite", "Pied Kingfisher", "Greater Coucal"]}, {"label": "Common passage migrants", "items": ["Edible-nest Swiftlet", "Greater Sand Plover", "Pacific Golden Plover", "Grey-tailed Tattler", "Grey-streaked Flycatcher", "Yellow-rumped Flycatcher", "Asian Brown Flycatcher"]}, {"label": "Summer visitors", "items": ["Blue-tailed Bee-eater", "White-faced Plover", "Little Tern", "Black Drongo", "Plaintive Cuckoo"]}, {"label": "Winter visitors", "items": ["Great Cormorant", "Various shorebirds"]}, {"label": "✨ Notable records", "items": ["Malayan Night Heron", "Red-breasted Flycatcher", "Yellow Bunting", "Relict Gull", "Thick-billed Warbler", "Lesser Frigatebird", "Brown Booby", "Pallas's Gull"], "highlight": true}], "tips_zh": "先从岸边观察海面与潮线，再留意开放区域的水塘、草丛和灌木。满潮前后留意在沙滩上停歇的鸟群；退潮后随着滩涂逐渐露出，水鸟会陆续前来觅食。与停歇的鸟群保持距离，不进入围挡区域，也不下滩涂追鸟。", "tips_en": "Scan the sea and tideline from shore, then check the ponds, grass and shrubs in open areas. Keep your distance from resting birds. Do not enter fenced areas or walk onto the mudflats to pursue birds.", "local_map": {"bbox": [118.18, 24.5083, 118.1965, 24.5183], "scale_m": 100, "flag": {"lon": 118.1886, "lat": 24.5142, "zh": "湖里区五通浦口 (瑞云宫)", "en": "Wutong Pukou (Ruiyun Temple)"}, "subspots": [{"lon": 118.191444, "lat": 24.517803, "gcj_lon": 118.19624, "gcj_lat": 24.515026, "zh": "荒地 (蜂虎/林鸟)", "en": "Open Ground", "dx": 14, "dy": 5, "anchor": "start", "img_px": [540.5, 152.5]}, {"lon": 118.191878, "lat": 24.515622, "gcj_lon": 118.196673, "gcj_lat": 24.512845, "zh": "水塘 (水鸟/林鸟)", "en": "Pond", "dx": 14, "dy": 5, "anchor": "start", "img_px": [598.5, 499.5]}, {"lon": 118.194083, "lat": 24.516105, "gcj_lon": 118.198873, "gcj_lat": 24.513324, "zh": "沙滩 (鸻鹬水鸟)", "en": "Sand Beach", "dx": 14, "dy": 5, "anchor": "start", "img_px": [858.5, 407.5]}], "roads": [{"pts": [[118.1832, 24.5188], [118.1852, 24.5142], [118.1865, 24.5085]], "zh": "环岛东路", "en": "Huandao E. Rd", "major": true}, {"pts": [[118.1852, 24.5142], [118.1886, 24.514], [118.1895, 24.5135]], "zh": "浦口路", "en": "Pukou Path", "major": false}], "water_areas": [[[118.1876, 24.5127], [118.1883, 24.5126], [118.1886, 24.5119], [118.1884, 24.5113], [118.1878, 24.5113], [118.1875, 24.512]]], "green_areas": [[[118.1835, 24.5185], [118.1892, 24.5185], [118.189, 24.5142], [118.185, 24.5142]]], "landmarks": [{"lon": 118.1862, "lat": 24.5168, "zh": "浦口社", "en": "Pukou", "type": "village"}, {"lon": 118.1848, "lat": 24.5115, "zh": "五通社区", "en": "Wutong", "type": "village"}, {"lon": 118.1932, "lat": 24.5155, "zh": "厦门东海域", "en": "Eastern Sea", "type": "water"}]}}, {"id": 4, "num": "④", "area_key": "island", "habitat_tag": "forest", "lon": 118.147177, "lat": 24.508364, "gcj_lon": 118.152081, "gcj_lat": 24.505669, "overview_px": [960.8, 1400.3], "district_zh": "湖里区", "district_en": "Huli District", "name_zh": "湖里区虎头山公园", "name_en": "Hutoushan Park", "short_zh": "虎头山公园", "short_en": "Hutoushan Park", "habitat_zh": "城市森林公园 / 迁徙林鸟驿站", "habitat_en": "Urban Forest Park & Migrant Stopover", "duration_zh": "约 2 小时（迁徙季可预留半天）", "duration_en": "About 2 hours (allow half a day during migration)", "months_zh": "3—5月、9—12月", "months_en": "March–May and September–December", "difficulty_stars": "★☆☆☆☆", "difficulty_zh": "★☆☆☆☆　公交可达；环山步道有坡道和台阶，建议自带饮水。", "difficulty_en": "★☆☆☆☆ (1/5) Accessible by bus. The hillside paths include slopes and steps; bring drinking water.", "summary_zh": "厦门岛内核心迁徙林鸟驿站，春秋迁徙季盛产寿带、紫寿带、各类姬鹟与柳莺，曾记录仙八色鸫与琉球姬鹟。", "summary_en": "A premier urban stopover for migrating flycatchers, paradise flycatchers, leaf warblers and thrushes.", "desc_zh": ["虎头山公园位于厦门岛湖里区金尚路东侧，面积约14万平方米。园内的林木与灌丛为迁徙途中的林鸟提供了停歇和觅食空间。春秋迁徙季，沿林间步道留意树冠、林缘与灌丛，有机会遇见各种莺类、鹟类等过境鸟；入冬后，也可寻找鸫类的身影。"], "desc_en": ["Hutoushan Park lies east of Jinshang Road in Huli District on Xiamen Island and covers approximately 140,000 square metres. Its trees and shrubs provide resting and feeding habitat for migrating forest birds. During spring and autumn migration, walk slowly along the wooded paths and watch the canopy, forest edges and undergrowth for passing warblers, flycatchers and other migrants. In winter, look for thrushes."], "transport_zh": "导航至“虎头山公园”（湖里区金尚路1042号）；也可乘公交至太薇山庄站、第二福利院站或金山小学站，下车后步行前往。园区及周边停车位较少，建议优先选择公共交通或打车前往。", "transport_en": "Navigate to ‘Hutoushan Park’ (No. 1042 Jinshang Road, Huli District). Alternatively, take a bus to Taiwei Shanzhuang, Di'er Fuli Yuan or Jinshan Xiaoxue bus stop, then walk to the park. Public transport or a taxi is recommended.", "key_birds_zh": ["紫寿带", "寿带", "黄眉姬鹟", "仙八色鸫", "琉球姬鹟"], "key_birds_en": ["Japanese Paradise Flycatcher", "Amur Paradise Flycatcher", "Fairy Pitta", "Ryukyu Flycatcher"], "bird_groups_zh": [{"label": "常见留鸟", "items": ["白头鹎", "红嘴蓝鹊", "黑脸噪鹛"]}, {"label": "常见过境鸟", "items": ["寿带", "紫寿带", "北灰鹟", "灰纹鹟", "黄眉姬鹟", "白腹蓝鹟", "极北柳莺", "淡脚柳莺"]}, {"label": "夏候鸟", "items": ["八声杜鹃", "噪鹃"]}, {"label": "冬候鸟", "items": ["白腹鸫", "灰背鸫"]}, {"label": "✨ 高光鸟种记录", "items": ["琉球姬鹟", "白喉林鹟", "仙八色鸫", "黑冠鳽", "日本鹰鸮", "日本歌鸲"], "highlight": true}], "bird_groups_en": [{"label": "Common residents", "items": ["Light-vented Bulbul", "Red-billed Blue Magpie", "Masked Laughingthrush"]}, {"label": "Common passage migrants", "items": ["Amur Paradise Flycatcher", "Japanese Paradise Flycatcher", "Asian Brown Flycatcher", "Grey-streaked Flycatcher", "Narcissus Flycatcher", "Blue-and-white Flycatcher", "Arctic Warbler", "Pale-legged Leaf Warbler"]}, {"label": "Summer visitors", "items": ["Plaintive Cuckoo", "Asian Koel"]}, {"label": "Winter visitors", "items": ["Pale Thrush", "Grey-backed Thrush"]}, {"label": "✨ Notable records", "items": ["Ryukyu Flycatcher", "Brown-chested Jungle Flycatcher", "Fairy Pitta", "Malayan Night Heron", "Japanese Scops Owl", "Japanese Robin"], "highlight": true}], "tips_zh": "过境鸟停留时间短，鸟况可能逐日变化。清晨放慢脚步，先听鸣声，再寻找枝叶间的鸟影。", "tips_en": "Passage migrants may stay only briefly, so sightings can change from day to day. In the early morning, slow down, listen for calls and song, and then search among the leaves.", "local_map": {"bbox": [118.1289, 24.5008, 118.1442, 24.5101], "scale_m": 100, "flag": {"lon": 118.1342, "lat": 24.5037, "zh": "湖里区虎头山公园", "en": "Hutoushan Park"}, "subspots": [{"lon": 118.147177, "lat": 24.508364, "gcj_lon": 118.152081, "gcj_lat": 24.505669, "zh": "山顶平台", "en": "Hilltop Platform", "dx": 14, "dy": 5, "anchor": "start", "img_px": [565.5, 468.5]}], "roads": [{"pts": [[118.1322, 24.5105], [118.1322, 24.501]], "zh": "金尚路", "en": "Jinshang Rd", "major": true}, {"pts": [[118.129, 24.5025], [118.144, 24.5024]], "zh": "金山西路", "en": "Jinshan W. Rd", "major": true}, {"pts": [[118.1392, 24.5105], [118.1412, 24.506], [118.1402, 24.501]], "zh": "枋湖东路", "en": "Fanghu E. Rd", "major": true}, {"pts": [[118.1332, 24.5048], [118.135, 24.5055], [118.1364, 24.5049], [118.1388, 24.5052]], "zh": "环山步道", "en": "Park Trail", "major": false}], "water_areas": [], "green_areas": [[[118.1325, 24.5068], [118.1405, 24.5068], [118.1405, 24.5038], [118.1325, 24.5038]]], "landmarks": [{"lon": 118.1376, "lat": 24.5056, "zh": "▲ 虎头山", "en": "▲ Hutou Hill", "type": "peak"}, {"lon": 118.139, "lat": 24.505, "zh": "万福寺", "en": "Wanfu Temple", "type": "village"}, {"lon": 118.1304, "lat": 24.5048, "zh": "🌲 薛岭山公园", "en": "🌲 Xueling Mtn Park", "type": "park"}]}}, {"id": 5, "num": "⑤", "area_key": "haicang", "habitat_tag": "mountain", "lon": 117.907333, "lat": 24.58269, "gcj_lon": 117.911997, "gcj_lat": 24.579662, "overview_px": [260.3, 1143.3], "district_zh": "海沧区", "district_en": "Haicang District", "name_zh": "海沧区天竺山森林公园", "name_en": "Tianzhu Mountain Forest Park", "short_zh": "天竺山森林公园", "short_en": "Tianzhu Mtn Park", "habitat_zh": "山地常绿阔叶林 / 溪谷 / 水库", "habitat_en": "Subtropical Mountain Forest, Streams & Reservoirs", "duration_zh": "西线 2—4 小时；东线 3—5 小时或半天", "duration_en": "West routes: 2–4 hrs; East route: 3–5 hrs or half day", "months_zh": "全年皆宜（日出至上午9点最佳）", "months_en": "Year-round (best from sunrise to ~9 a.m.)", "difficulty_stars": "★★★☆☆", "difficulty_zh": "★★★☆☆　难点在于范围大、林子高、找鸟需要听声定位。山里注意走水泥路和石子路，建议自备水和干粮；春夏季蚊虫较多，驱蚊液必备。", "difficulty_en": "★★★☆☆ (3/5) Large area and tall canopy require locating birds by call. Stay on paved paths, bring water and snacks, and carry insect repellent in spring and summer.", "summary_zh": "森林覆盖率超98%，记录鸟种超200种，是厦门市林鸟多样性最高区域，拥有西门双线与东门观鸟路线。", "summary_en": "Over 98% forest cover and 200+ recorded bird species—Xiamen's richest area for forest birds, featuring 3 classic birding trails.", "desc_zh": ["天竺山森林公园地处海沧区西北部，占地面积约26.51平方公里，海拔最高933米。园区森林覆盖率98%以上，水系发达，拥有天竺湖、皓月湖、两二湖等水库，是厦门市林鸟多样性最高区域，记录鸟种超过200种。例如白鹇、白眉山鹧鸪、绿翅金鸠、灰背燕尾、华南斑胸钩嘴鹛、灰树鹊、红嘴相思鸟、栗头织叶莺等；白喉短翅鸫、丽星鹩鹛、小鳞胸鹪鹛、大拟啄木鸟的叫声也在山谷间回响不断。", "🔴 西门路线一｜西门—四季花谷—中海林—大峡谷：从西门进入，沿四季花谷溪流向中海林方向走，再循路牌前往大峡谷入口。经过景区厕所后约200米路段值得放慢脚步仔细观察。建议尽早前往，预留2—4小时。", "🔵 西门路线二｜西门—皓月湖—溪头狮：从西门沿皓月湖往溪头狮方向行走。路线较长但总体平缓，游客较少，建议至少预留2—4小时并自带饮水食物。", "🟢 东门路线｜东门—百竹园—天竺湖—龙门寺—真寂寺：从东门沿山间步道上行，经过百竹园、天竺湖、龙门寺，体力允许可向真寂寺探索。建议预留3—5小时。"], "desc_en": ["Tianzhu Mountain Forest Park lies in northwestern Haicang District, covering 26.51 sq km up to 933 m elevation with over 98% forest cover. With more than 200 recorded species, it is Xiamen's most diverse area for forest birds, including Silver Pheasant, White-necklaced Partridge, Common Emerald Dove, Slaty-backed Forktail, Spotted Elachura, Pygmy Cupwing and Great Barbet.", "🔴 West Gate Route 1 | West Gate — Four Seasons Flower Valley — Zhonghailin — Grand Canyon: Follow the stream through Four Seasons Flower Valley to the Grand Canyon trail. Search carefully within ~200m of the canyon public toilet. Allow 2–4 hours.", "🔵 West Gate Route 2 | West Gate — Haoyue Lake — Xitoushi: A longer, fairly level route along Haoyue Lake with fewer visitors. Allow 2–4 hours and bring water and food.", "🟢 East Gate Route | East Gate — Bamboo Garden — Tianzhu Lake — Longmen Temple — Zhenji Temple: Uphill trail passing Bamboo Garden, Tianzhu Lake and Longmen Temple towards Zhenji Temple. Allow 3–5 hours."], "transport_zh": "天竺山东门交通便利，乘地铁2号线至终点站“天竺山站”可直达。天竺山西门无直达地铁，接驳车发车较晚，赶早观鸟建议自驾或打车导航至“天竺山森林公园西门”。东西门路线上均有景区接驳车。", "transport_en": "Take Metro Line 2 to Tianzhu Mountain Station for the East Gate. For early morning birding at the West Gate, driving or taking a taxi is recommended. Park shuttles operate along both east and west routes.", "key_birds_zh": ["白鹇", "仙八色鸫", "红头咬鹃", "丽星鹩鹛", "海南蓝仙鹟"], "key_birds_en": ["Silver Pheasant", "Fairy Pitta", "Red-headed Trogon", "Spotted Elachura", "Hainan Blue Flycatcher"], "bird_groups_zh": [{"label": "常见留鸟", "items": ["白鹇", "白眉山鹧鸪", "绿翅金鸠", "淡眉雀鹛", "棕颈钩嘴鹛", "红胸啄花鸟", "栗背短脚鹎", "绿翅短脚鹎", "黑短脚鹎", "灰树鹊", "黑枕王鹟", "凤头鹰", "林雕", "灰背燕尾"]}, {"label": "夏候鸟", "items": ["褐胸鹟", "海南蓝仙鹟", "橙头地鸫", "乌鹃", "大鹰鹃", "小杜鹃", "棕腹鹰鹃", "红翅凤头鹃"]}, {"label": "过境/迁徙季", "items": ["仙八色鸫", "黄眉姬鹟", "白眉姬鹟", "棕尾褐鹟", "紫寿带", "绿背姬鹟", "苍鹰", "日本鹰鸮", "蓝歌鸲"]}, {"label": "冬候鸟", "items": ["红胁蓝尾鸲", "白腹鸫", "白眉鸫", "乌灰鸫", "鳞头树莺", "红尾歌鸲", "铜蓝鹟", "鸲姬鹟"]}, {"label": "✨ 高光鸟种记录", "items": ["仙八色鸫", "红腿斑秧鸡", "白喉斑秧鸡", "大鹃鵙", "红头咬鹃", "琉球姬鹟", "丘鹬"], "highlight": true}], "bird_groups_en": [{"label": "Common residents", "items": ["Silver Pheasant", "White-necklaced Partridge", "Common Emerald Dove", "Huet's Fulvetta", "Streak-breasted Scimitar Babbler", "Fire-breasted Flowerpecker", "Chestnut Bulbul", "Mountain Bulbul", "Black Bulbul", "Grey Treepie", "Black-naped Monarch", "Crested Goshawk", "Black Eagle", "Slaty-backed Forktail"]}, {"label": "Summer visitors", "items": ["Brown-breasted Flycatcher", "Hainan Blue Flycatcher", "Orange-headed Thrush", "Square-tailed Drongo-Cuckoo", "Large Hawk-Cuckoo", "Asian Lesser Cuckoo", "Hodgson's Hawk-Cuckoo"]}, {"label": "Passage migrants", "items": ["Fairy Pitta", "Narcissus Flycatcher", "Yellow-rumped Flycatcher", "Ferruginous Flycatcher", "Japanese Paradise Flycatcher", "Green-backed Flycatcher", "Eurasian Goshawk", "Japanese Scops Owl", "Siberian Blue Robin"]}, {"label": "Winter visitors", "items": ["Red-flanked Bluetail", "Pale Thrush", "Eyebrowed Thrush", "Japanese Thrush", "Asian Stubtail", "Rufous-tailed Robin", "Verditer Flycatcher", "Mugimaki Flycatcher"]}, {"label": "✨ Notable records", "items": ["Fairy Pitta", "Red-legged Crake", "Slaty-legged Crake", "Large Cuckooshrike", "Red-headed Trogon", "Ryukyu Flycatcher", "Eurasian Woodcock"], "highlight": true}], "tips_zh": "周末游客较多，建议提早前往，最佳观鸟时间为日出到上午9点左右。很多林鸟藏在树冠层或灌丛深处，先靠鸣声定位再慢慢寻找效率更高。", "tips_en": "The park is busy on weekends, so arrive early. The best birding is around sunrise to approximately 9 a.m. Listen for bird calls first, then search patiently in the canopy and undergrowth.", "local_map": {"bbox": [117.889, 24.5712, 117.942, 24.6034], "scale_m": 500, "flag": {"lon": 117.907, "lat": 24.5784, "zh": "海沧区天竺山森林公园", "en": "Tianzhu Mtn Forest Park"}, "subspots": [{"lon": 117.907333, "lat": 24.58269, "gcj_lon": 117.911997, "gcj_lat": 24.579662, "zh": "皓月湖", "en": "Haoyue Lake", "dx": -14, "dy": 5, "anchor": "end", "img_px": [305.5, 651.5]}, {"lon": 117.905531, "lat": 24.59288, "gcj_lon": 117.910196, "gcj_lat": 24.589851, "zh": "四季花谷", "en": "Four Seasons Flower Valley", "dx": 14, "dy": 5, "anchor": "start", "img_px": [298.5, 429.5]}, {"lon": 117.894786, "lat": 24.604284, "gcj_lon": 117.899457, "gcj_lat": 24.601255, "zh": "大峡谷", "en": "Grand Canyon", "dx": 14, "dy": 5, "anchor": "start", "img_px": [61.5, 181.5]}, {"lon": 117.9448, "lat": 24.59445, "gcj_lon": 117.949492, "gcj_lat": 24.591462, "zh": "天竺湖", "en": "Tianzhu Lake", "dx": -14, "dy": 5, "anchor": "end", "img_px": [1127.5, 390.5]}, {"lon": 117.938994, "lat": 24.597363, "gcj_lon": 117.943678, "gcj_lat": 24.594364, "zh": "龙门寺", "en": "Longmen Temple", "dx": -14, "dy": 5, "anchor": "end", "img_px": [1012.5, 328.5]}, {"lon": 117.940148, "lat": 24.600685, "gcj_lon": 117.944834, "gcj_lat": 24.597688, "zh": "真寂寺", "en": "Zhenji Temple", "dx": -14, "dy": 5, "anchor": "end", "img_px": [1029.5, 243.5]}], "roads": [{"pts": [[117.9065, 24.5812], [117.9012, 24.5863], [117.9022, 24.5925], [117.8955, 24.5965]], "zh": "西门路线一", "en": "West Route , "difficulty_stars": "★★★☆☆", "difficulty_zh": "★★★☆☆　范围大、杂草多、蚊虫多，建议穿长袖长裤防虫叮咬；三个子观鸟点相距较远，转换鸟点建议自驾。", "difficulty_en": "★★★☆☆ (3/5) Extensive area with tall grass and insects. Wear long sleeves and trousers; driving is recommended between the three sub-sites.", "summary_zh": "厦门鸟种记录最多的区域（超220种），紫水鸡常年栖息，2024年超30只东方白鹳在此越冬，重点走访白䴙䴘塘、过芸溪和雁塘。", "summary_en": "Xiamen's highest species total (220+ species), home to Grey-headed Swamphens and wintering Oriental Storks across White Grebe Pond, Guoyun Stream and Goose Pond.", "desc_zh": ["马銮湾湿地是厦门鸟类多样性最丰富的区域之一，也是厦门鸟种记录最多的区域，记录鸟种超过220种，许多厦门新纪录都诞生于此。这里也是厦门紫水鸡数量最多的地方；2024年，超过30只国家一级保护动物东方白鹳在此越冬。观鸟可重点走访白䴙䴘塘、过芸溪和雁塘三处：", "⚪ 白䴙䴘塘：因一只白变小䴙䴘多次来此越冬而得名。冬季可观察琵嘴鸭、赤颈鸭、凤头䴙䴘、泽鹬、反嘴鹬和鹤鹬，曾有小天鹅越冬及白腹隼雕、渔鸥记录。", "🔵 过芸溪：内湾大桥下水域较浅，适合观察浅水觅食的青脚滨鹬、金眶鸻、红脚鹬、长趾滨鹬，曾记录凤头麦鸡、白眼潜鸭及西秧鸡。", "🔴 雁塘：马銮湾鸟种最丰富的湿地。紫水鸡常年栖息，夏季黄斑苇鳽、栗苇鳽繁殖，冬季白额雁、豆雁、草鹭、大麻鳽、蓝喉歌鸲、中华攀雀及鹗、白腹鹞、鹊鹞等猛禽汇聚。"], "desc_en": ["The wetlands of Maluan Bay have Xiamen's highest recorded species total (over 220 species) and its largest population of Grey-headed Swamphen. In 2024, more than 30 Class I protected Oriental Storks wintered here. Three places are particularly worth visiting:", "⚪ Bai Piti Tang (White Grebe Pond): Named after a returning leucistic Little Grebe. Look for Northern Shoveler, Eurasian Wigeon, Great Crested Grebe, Pied Avocet, Spotted Redshank, Great Cormorants and gulls (including Pallas's Gull and Bewick's Swan records).", "🔵 Guoyun Stream: Shallow water beneath Neiwan Bridge attracts ducks and shorebirds such as Temminck's Stint, Little Ringed Plover, Common Redshank, Long-toed Stint, Northern Lapwing and Ferruginous Duck.", "🔴 Yantang (Goose Pond): Year-round Grey-headed Swamphens; breeding bitterns and Oriental Pratincoles in summer; wintering geese, Great Bittern, Bluethroat, Chinese Penduline Tit and harriers in winter."], "transport_zh": "马銮湾湿地范围较大，建议自驾前往，开车转换各个鸟点更方便。公共交通可乘地铁2号线或6号线至马銮中心站或东瑶站，再打车前往各子点位。", "transport_en": "Driving makes it much easier to move between the three sites. By public transport, take Metro Line 2 or 6 to Maluan Center or Dongyao Station, then continue by taxi.", "key_birds_zh": ["东方白鹳", "紫水鸡", "小天鹅", "大麻鳽", "中华攀雀", "白腹鹞"], "key_birds_en": ["Oriental Stork", "Grey-headed Swamphen", "Bewick's Swan", "Great Bittern", "Chinese Penduline Tit"], "bird_groups_zh": [{"label": "常见留鸟", "items": ["紫水鸡", "斑鱼狗", "黑水鸡", "白鹭", "纯色山鹪莺", "小䴙䴘", "黑翅鸢", "黑鸢", "黑翅长脚鹬"]}, {"label": "过境鸟", "items": ["棉凫", "水雉", "紫背苇鳽", "白腹蓝鹟", "紫寿带", "矛斑蝗莺", "小蝗莺", "凤头麦鸡", "尖尾滨鹬", "青脚滨鹬"]}, {"label": "夏候鸟", "items": ["白额燕鸥", "普通燕鸻", "栗苇鳽", "董鸡", "黄斑苇鳽"]}, {"label": "冬候鸟", "items": ["大麻鳽", "白额雁", "豆雁", "白琵鹭", "黑脸琵鹭", "芦鹀", "苇鹀", "泽鹬", "白腹鹞", "鹊鹞", "淡色沙燕", "蓝喉歌鸲", "红喉歌鸲", "小田鸡", "草鹭", "罗纹鸭", "琵嘴鸭", "赤颈鸭", "凤头潜鸭", "短耳鸮", "中华攀雀"]}, {"label": "✨ 高光鸟种记录", "items": ["东方白鹳", "黑鹳", "斑头秋沙鸭", "西秧鸡", "白尾鹞", "叽喳柳莺", "远东苇莺", "小天鹅", "花脸鸭", "黄嘴白鹭", "东方鸻", "小杓鹬", "遗鸥", "渔鸥", "红脚隼", "楔尾伯劳"], "highlight": true}], "bird_groups_en": [{"label": "Common residents", "items": ["Grey-headed Swamphen", "Pied Kingfisher", "Common Moorhen", "Little Egret", "Plain Prinia", "Little Grebe", "Black-winged Kite", "Black Kite", "Black-winged Stilt"]}, {"label": "Passage migrants", "items": ["Cotton Pygmy Goose", "Pheasant-tailed Jacana", "Schrenck's Bittern", "Blue-and-white Flycatcher", "Japanese Paradise Flycatcher", "Lanceolated Warbler", "Pallas's Grasshopper Warbler", "Northern Lapwing", "Sharp-tailed Sandpiper", "Temminck's Stint"]}, {"label": "Summer visitors", "items": ["Little Tern", "Oriental Pratincole", "Cinnamon Bittern", "Watercock", "Yellow Bittern"]}, {"label": "Winter visitors", "items": ["Great Bittern", "Greater White-fronted Goose", "Bean Goose", "Eurasian Spoonbill", "Black-faced Spoonbill", "Common Reed Bunting", "Pallas's Reed Bunting", "Marsh Sandpiper", "Eastern Marsh Harrier", "Pied Harrier", "Bluethroat", "Siberian Rubythroat", "Purple Heron", "Falcated Duck", "Northern Shoveler", "Eurasian Wigeon", "Short-eared Owl", "Chinese Penduline Tit"]}, {"label": "✨ Notable records", "items": ["Oriental Stork", "Black Stork", "Smew", "Western Water Rail", "Hen Harrier", "Common Chiffchaff", "Manchurian Reed Warbler", "Bewick's Swan", "Baikal Teal", "Chinese Egret", "Oriental Plover", "Little Curlew", "Relict Gull", "Pallas's Gull", "Chinese Grey Shrike"], "highlight": true}], "tips_zh": "湿地周边杂草较多，建议穿长袖长裤、做好防蚊虫准备。请在道路及开放区域观察，与鸟类保持距离，不进入芦苇和泥滩追鸟。", "tips_en": "Wear long sleeves and trousers and protect yourself against insects. Watch from roads and public areas, keep your distance from birds, and do not enter the reeds or mudflats to pursue them.", "local_map": {"bbox": [117.9507, 24.5417, 118.0037, 24.5739], "scale_m": 500, "flag": {"lon": 117.9742, "lat": 24.5558, "zh": "海沧区马銮湾", "en": "Maluan Bay"}, "subspots": [{"lon": 117.975118, "lat": 24.560863, "gcj_lon": 117.979873, "gcj_lat": 24.557949, "zh": "过芸溪", "en": "Guoyun Stream", "dx": 14, "dy": 5, "anchor": "start", "img_px": [587.5, 340.5]}, {"lon": 117.972736, "lat": 24.552286, "gcj_lon": 117.977484, "gcj_lat": 24.549366, "zh": "雁塘", "en": "Goose Pond (Yantang)", "dx": 14, "dy": 5, "anchor": "start", "img_px": [531.5, 507.5]}, {"lon": 117.98309, "lat": 24.551427, "gcj_lon": 117.987865, "gcj_lat": 24.548536, "zh": "白䴙䴘塘", "en": "White Grebe Pond", "dx": 14, "dy": 5, "anchor": "start", "img_px": [804.5, 564.5]}], "roads": [{"pts": [[117.9515, 24.56], [117.968, 24.5675], [117.98, 24.5718]], "zh": "海翔大道", "en": "Haixiang Ave", "major": true}, {"pts": [[117.9805, 24.572], [117.9815, 24.558], [117.9815, 24.542]], "zh": "灌新路", "en": "Guanxin Rd", "major": true}], "water_areas": [], "green_areas": [], "landmarks": [{"lon": 117.9582, "lat": 24.5508, "zh": "🚇 东瑶站", "en": "🚇 Dongyao Sta.", "type": "metro"}, {"lon": 117.9965, "lat": 24.5515, "zh": "马銮湾", "en": "Maluan Bay", "type": "water"}, {"lon": 117.992, "lat": 24.543, "zh": "🌲 马銮湾南岸公园", "en": "🌲 South Bank Park", "type": "park"}]}}, {"id": 7, "num": "⑦", "area_key": "jimei", "habitat_tag": "wetland", "lon": 118.071624, "lat": 24.580022, "gcj_lon": 118.076601, "gcj_lat": 24.57735, "overview_px": [723.0, 1176.4], "district_zh": "集美区", "district_en": "Jimei District", "name_zh": "集美区杏林湾", "name_en": "Xinglin Bay", "short_zh": "集美杏林湾", "short_en": "Xinglin Bay", "habitat_zh": "国家城市湿地公园 / 淡水湖泊 / 芦苇岛链", "habitat_en": "National Urban Wetland Park, Lake & Reed Islands", "duration_zh": "约 2—3 小时", "duration_en": "About 2–3 hours", "months_zh": "11月—次年3月（万只鸬鹚越冬）；春秋迁徙季", "months_en": "Nov–Mar (8,000–10,000+ wintering cormorants); Spring & Autumn", "difficulty_stars": "★★☆☆☆", "difficulty_zh": "★★☆☆☆　杏林湾道路总体平缓，但范围较广、步行距离较长。水上运动中心附近可沿水上自行车道步行或骑行观鸟；停下来观察时请避让骑行者。", "difficulty_en": "★★☆☆☆ (2/5) Paths are level but extensive. Near the Water Sports Centre, you can walk or cycle along the waterfront cycling path; make room for cyclists when stopping.", "summary_zh": "厦门最大城市淡水湖与唯一国家城市湿地公园，越冬高峰可达 8000—10000+ 只普通鸬鹚，场面极其震撼。", "summary_en": "Xiamen's largest urban freshwater lake and National Urban Wetland Park, famous for 8,000–10,000+ wintering Great Cormorants.", "desc_zh": ["杏林湾位于厦门集美区核心地带，水域面积6.9平方千米，是厦门面积最大的城市淡水湖、厦门园林博览苑所在地，也是厦门唯一的国家城市湿地公园，入选福建省第一批重要湿地。每年10月前后，普通鸬鹚的先头部队率先抵达，越冬高峰时杏林湾及园博苑水域的鸬鹚可达8000至10000多只。成群的普通鸬鹚在湾内捕鱼、盘旋，是这里最具代表性的观鸟景象。", "冬季水面还可寻找凤头潜鸭、斑背潜鸭、白骨顶、红嘴巨燕鸥等越冬水鸟。秋冬的芦苇间可留意黑眉苇莺、远东苇莺和中华攀雀；迁徙季则有机会遇见多种蝗莺。可重点走访园博苑内的观鸟长廊、迁想桥、海洋岛，以及湾东侧的水上运动中心、水上自行车道和北侧的水秀广场。"], "desc_en": ["Xinglin Bay lies in central Jimei District. Its 6.9-sq-km water surface makes it Xiamen's largest urban freshwater lake, home to the Xiamen Garden Expo Park and the city's only National Urban Wetland Park. At the winter peak, 8,000 to more than 10,000 Great Cormorants gather across the bay—their flocks fishing and circling above the water are Xinglin Bay's signature spectacle.", "In winter, look for Tufted Duck, Greater Scaup, Eurasian Coot and Caspian Tern on the water, and Black-browed Reed Warbler, Manchurian Reed Warbler and Chinese Penduline Tit in the reeds. Key viewpoints include the Birdwatching Walkway, Qianxiang Bridge and Haiyang Island inside the Garden Expo Park, as well as the Water Sports Centre, Waterfront Cycling Path and Water Show Square."], "transport_zh": "【园博苑】导航至“厦门园博苑西一门”；或乘地铁1号线至园博苑站2号口出站步行入园。【水上运动中心】适合自驾或打车前往，导航至“厦门水上运动中心”，周边有停车场。", "transport_en": "[Garden Expo Park] Navigate to ‘Xiamen Garden Expo Park West Gate 1’, or take Metro Line 1 to Garden Expo Park Station (Exit 2). [Water Sports Centre] Navigate to ‘Xiamen Water Sports Centre’ by car or taxi.", "key_birds_zh": ["普通鸬鹚", "凤头潜鸭", "红嘴巨燕鸥", "中华攀雀", "东亚蝗莺", "黑脸琵鹭"], "key_birds_en": ["Great Cormorant", "Tufted Duck", "Caspian Tern", "Chinese Penduline Tit", "Styan's Grasshopper Warbler"], "bird_groups_zh": [{"label": "常见留鸟", "items": ["白鹭", "池鹭", "夜鹭", "戴胜", "乌鸫", "白喉红臀鹎", "紫水鸡", "褐翅鸦鹃"]}, {"label": "迁徙季可留意", "items": ["栗苇鳽", "灰翅浮鸥", "东方大苇莺", "小蝗莺", "黑枕黄鹂", "黄胸鹀", "远东苇莺"]}, {"label": "常见夏候鸟", "items": ["黄斑苇鳽", "噪鹃", "八声杜鹃", "白额燕鸥"]}, {"label": "常见冬候鸟", "items": ["普通鸬鹚", "凤头潜鸭", "斑背潜鸭", "白骨顶", "凤头䴙䴘", "大白鹭", "苍鹭", "红嘴巨燕鸥"]}, {"label": "✨ 高光鸟种记录", "items": ["东亚蝗莺", "黑脸琵鹭", "黄嘴白鹭", "渔鸥", "朱背啄花鸟", "厚嘴苇莺"], "highlight": true}], "bird_groups_en": [{"label": "Common residents", "items": ["Little Egret", "Chinese Pond Heron", "Black-crowned Night Heron", "Eurasian Hoopoe", "Chinese Blackbird", "Sooty-headed Bulbul", "Grey-headed Swamphen", "Greater Coucal"]}, {"label": "Passage migrants", "items": ["Cinnamon Bittern", "Whiskered Tern", "Oriental Reed Warbler", "Pallas's Grasshopper Warbler", "Black-naped Oriole", "Yellow-breasted Bunting", "Manchurian Reed Warbler"]}, {"label": "Common summer visitors", "items": ["Yellow Bittern", "Asian Koel", "Plaintive Cuckoo", "Little Tern"]}, {"label": "Common winter visitors", "items": ["Great Cormorant", "Tufted Duck", "Greater Scaup", "Eurasian Coot", "Great Crested Grebe", "Great Egret", "Grey Heron", "Caspian Tern"]}, {"label": "✨ Notable records", "items": ["Styan's Grasshopper Warbler", "Black-faced Spoonbill", "Chinese Egret", "Pallas's Gull", "Scarlet-backed Flowerpecker", "Thick-billed Warbler"], "highlight": true}], "tips_zh": "清晨和傍晚是鸬鹚活动的高峰。站在水上自行车道，成群的鸬鹚贴着水面低空掠过，或在远处的树冠上列成黑色的“瞭望队列”，视觉冲击与扑翅声相当震撼！观察时请与鸟群保持距离，把安静留给水面。", "tips_en": "Cormorants are especially active in the early morning and late afternoon. From the waterfront cycling path, watch flocks skim low over the water or line the distant treetops like dark sentinels. Give the flocks space and keep the waterside quiet.", "local_map": {"bbox": [118.0428, 24.5667, 118.1028, 24.6031], "scale_m": 500, "flag": {"lon": 118.0692, "lat": 24.5712, "zh": "集美区杏林湾", "en": "Xinglin Bay"}, "subspots": [{"lon": 118.075047, "lat": 24.598885, "gcj_lon": 118.080028, "gcj_lat": 24.596216, "zh": "水秀广场", "en": "Water Show Square", "dx": 0, "dy": 19, "anchor": "middle", "img_px": [644.5, 41.5]}, {"lon": 118.06583, "lat": 24.595461, "gcj_lon": 118.070803, "gcj_lat": 24.592781, "zh": "海洋岛", "en": "Haiyang Island", "dx": 14, "dy": 5, "anchor": "start", "img_px": [522.5, 255.5]}, {"lon": 118.069891, "lat": 24.58809, "gcj_lon": 118.074867, "gcj_lat": 24.585415, "zh": "迁想桥", "en": "Qianxiang Bridge", "dx": -14, "dy": 5, "anchor": "end", "img_px": [527.5, 430.5]}, {"lon": 118.071624, "lat": 24.580022, "gcj_lon": 118.076601, "gcj_lat": 24.57735, "zh": "观鸟长廊", "en": "Birdwatching Walkway", "dx": 14, "dy": 5, "anchor": "start", "img_px": [575.5, 527.5]}, {"lon": 118.083506, "lat": 24.577873, "gcj_lon": 118.08849, "gcj_lat": 24.575212, "zh": "水上运动中心 (水上自行车道)", "en": "Water Sports Centre / Cycling Path", "dx": -14, "dy": 5, "anchor": "end", "img_px": [862.5, 582.5]}], "roads": [{"pts": [[118.051, 24.602], [118.0505, 24.5855], [118.0615, 24.5715]], "zh": "杏锦路 / 地铁1号线", "en": "Metro Line 1", "major": true}, {"pts": [[118.0888, 24.602], [118.0868, 24.585], [118.0852, 24.571]], "zh": "田集连接线", "en": "Tianji Link Rd", "major": true}], "water_areas": [], "green_areas": [], "landmarks": [{"lon": 118.0612, "lat": 24.5715, "zh": "🚇 园博苑站", "en": "🚇 Yuanboyuan Sta.", "type": "metro"}, {"lon": 118.0505, "lat": 24.5845, "zh": "🚇 杏锦路站", "en": "🚇 Xingjin Rd Sta.", "type": "metro"}, {"lon": 118.0518, "lat": 24.596, "zh": "🚇 官任站", "en": "🚇 Guanren Sta.", "type": "metro"}, {"lon": 118.0805, "lat": 24.5875, "zh": "杏林湾水库", "en": "Xinglin Bay", "type": "water"}]}}, {"id": 8, "num": "⑧", "area_key": "tongan", "habitat_tag": "mountain", "lon": 118.028306, "lat": 24.865137, "gcj_lon": 118.033229, "gcj_lat": 24.862391, "overview_px": [633.5, 257.2], "district_zh": "同安区", "district_en": "Tong'an District", "name_zh": "同安区小坪森林公园", "name_en": "Xiaoping Forest Park", "short_zh": "小坪森林公园", "short_en": "Xiaoping Forest Park", "habitat_zh": "中高海拔山林 / 高山茶园 / 溪流 / 水库", "habitat_en": "Mountain Forest (400–800m), Tea Gardens, Streams & Reservoir", "duration_zh": "约 3—4 小时（兼顾水库与茶园建议预留半天）", "duration_en": "About 3–4 hours (allow half a day for both areas)", "months_zh": "2—4月最佳（春季鸟类鸣唱活跃）；冬季亦宜", "months_en": "February–April (peak bird song); Winter is also suitable", "difficulty_stars": "★★★★☆", "difficulty_zh": "★★★★☆　难点主要在盘山交通和听音找鸟，徒步距离不长。林木较高、灌丛较密，熟悉鸟鸣更有帮助。小坪森林公园公交站附近有餐饮补给。", "difficulty_en": "★★★★☆ (4/5) Main challenges are the winding mountain drive and locating birds in tall trees and dense shrubs by call. Food and supplies are available near the bus stop.", "summary_zh": "海拔400—800米的厦门高山林鸟“圣地”，重点走访小坪茶园与小坪水库，曾记录短尾鸦雀、点胸鸦雀、鹰雕等罕见鸟种。", "summary_en": "At 400–800m elevation, one of Xiamen's best places for mountain forest birds, parrotbills and raptors around Xiaoping Tea Gardens and Reservoir.", "desc_zh": ["小坪森林公园位于厦门北部山区，属于莲花国家森林景区之一，总面积约16.66平方千米，海拔在400—800米之间。较高的海拔以及森林、茶园、溪流、水库等多样生境，使其成为厦门观察林鸟的“圣地”之一。", "可重点走访小坪茶园和小坪水库：茶园及周边竹林曾记录短尾鸦雀、点胸鸦雀、高山短翅蝗莺、棕腹鹰鹃、小鳞胸鹪鹛、白喉山鹪莺等少见林鸟；鹰雕、白腹隼雕也曾从茶园上空飞过。溪流边可寻找灰背燕尾、红尾水鸲，也有红脚田鸡的记录。小坪水库一带可观察小白腰雨燕和烟腹毛脚燕繁殖，附近亦有两种鸦雀及斑尾鹃鸠的记录。"], "desc_en": ["Xiaoping Forest Park lies in Xiamen's northern mountains and forms part of Xiamen Lianhua National Forest Park, covering 16.66 sq km at elevations of 400–800 metres. Its elevation and mix of forest, tea gardens, streams and a reservoir make it one of Xiamen's premier sites for forest birds.", "Focus on the Xiaoping tea gardens and Xiaoping Reservoir. The tea gardens and nearby bamboo have records of Short-tailed Parrotbill, Spot-breasted Parrotbill, Russet Bush Warbler, Hodgson's Hawk-Cuckoo, Pygmy Cupwing and Hill Prinia; Mountain Hawk-Eagle and Bonelli's Eagle have also flown over. Along the streams, look for Slaty-backed Forktail and Plumbeous Water Redstart; around the reservoir, watch for breeding House Swifts and Asian House Martins."], "transport_zh": "建议自驾前往，从厦门岛内出发约需1—1.5小时。进山后有约10公里盘山路，急弯较多，需减速慢行。可分别导航至“小坪森林公园公交站”（靠近小坪茶园）和“小坪水库”；两处相隔一定距离，可沿山路行车，在安全地点停车观察。", "transport_en": "Driving is recommended (1–1.5 hours from Xiamen Island, including ~10 km of winding mountain road). Navigate separately to ‘Xiaoping Forest Park Bus Stop’ (near the tea gardens) and ‘Xiaoping Reservoir’; stop only where safe.", "key_birds_zh": ["短尾鸦雀", "点胸鸦雀", "红嘴相思鸟", "鹰雕", "林雕", "烟腹毛脚燕"], "key_birds_en": ["Short-tailed Parrotbill", "Spot-breasted Parrotbill", "Red-billed Leiothrix", "Mountain Hawk-Eagle", "Black Eagle"], "bird_groups_zh": [{"label": "常见留鸟", "items": ["灰胸竹鸡", "白喉山鹪莺", "红胸啄花鸟", "棕脸鹟莺", "棕颈钩嘴鹛", "华南斑胸钩嘴鹛", "红嘴相思鸟", "林雕", "蛇雕", "灰背燕尾", "红尾水鸲", "烟腹毛脚燕"]}, {"label": "夏候鸟", "items": ["大鹰鹃", "棕腹鹰鹃", "小杜鹃"]}, {"label": "✨ 高光鸟种记录", "items": ["白喉斑秧鸡", "短尾鸦雀", "点胸鸦雀", "高山短翅蝗莺", "丽星鹩鹛", "鹰雕", "白腹隼雕", "斑尾鹃鸠"], "highlight": true}], "bird_groups_en": [{"label": "Common residents", "items": ["Chinese Bamboo Partridge", "Hill Prinia", "Fire-breasted Flowerpecker", "Rufous-faced Warbler", "Streak-breasted Scimitar Babbler", "Grey-sided Scimitar Babbler", "Red-billed Leiothrix", "Black Eagle", "Crested Serpent Eagle", "Slaty-backed Forktail", "Plumbeous Water Redstart", "Asian House Martin"]}, {"label": "Summer visitors", "items": ["Large Hawk-Cuckoo", "Hodgson's Hawk-Cuckoo", "Asian Lesser Cuckoo"]}, {"label": "✨ Notable records", "items": ["Slaty-legged Crake", "Short-tailed Parrotbill", "Spot-breasted Parrotbill", "Russet Bush Warbler", "Spotted Elachura", "Mountain Hawk-Eagle", "Bonelli's Eagle", "Barred Cuckoo-Dove"], "highlight": true}], "tips_zh": "沿山路缓行，在安全地点停车听鸟，再下车寻找。鸟声密集的路段值得多停留一会儿。靠近竹丛和灌丛时请放轻动作；春夏季建议穿长袖长裤并携带驱蚊液。", "tips_en": "Drive slowly along the mountain road. At a safe place, stop to listen before getting out to search. Spend more time where birds are calling, and move gently near bamboo and shrubs.", "local_map": {"bbox": [118.0055, 24.8068, 118.0535, 24.836], "scale_m": 500, "flag": {"lon": 118.0265, "lat": 24.8225, "zh": "同安区小坪森林公园", "en": "Xiaoping Forest Park"}, "subspots": [{"lon": 118.021413, "lat": 24.875146, "gcj_lon": 118.026319, "gcj_lat": 24.872382, "zh": "小坪水库", "en": "Xiaoping Reservoir", "dx": 14, "dy": 5, "anchor": "start", "img_px": [418.5, 183.5]}, {"lon": 118.0352, "lat": 24.855128, "gcj_lon": 118.040138, "gcj_lat": 24.852399, "zh": "小坪茶园 (公交站)", "en": "Xiaoping Tea Garden", "dx": -14, "dy": 5, "anchor": "end", "img_px": [765.5, 721.5]}], "roads": [{"pts": [[118.0445, 24.838], [118.0442, 24.824], [118.0505, 24.806]], "zh": "G2517 沙厦高速", "en": "G2517 Expwy", "major": true}, {"pts": [[118.012, 24.831], [118.0165, 24.8215], [118.0215, 24.8105], [118.0365, 24.8095], [118.045, 24.808]], "zh": "井小线 / 盘山路", "en": "Jingxiao Mtn Rd", "major": false}, {"pts": [[118.0228, 24.8315], [118.0265, 24.824], [118.0295, 24.814], [118.0365, 24.8095]], "zh": "水库—茶园山路", "en": "Reservoir-Tea Trail", "major": false}], "water_areas": [[[118.0142, 24.838], [118.0178, 24.838], [118.0192, 24.8362], [118.0208, 24.8348], [118.0222, 24.8332], [118.0234, 24.8318], [118.0228, 24.8306], [118.0212, 24.8302], [118.0196, 24.8312], [118.0182, 24.8328], [118.0165, 24.8345], [118.0148, 24.8362]]], "green_areas": [[[118.008, 24.838], [118.052, 24.838], [118.052, 24.806], [118.008, 24.806]]], "landmarks": [{"lon": 118.0165, "lat": 24.8235, "zh": "小坪村", "en": "Xiaoping Village", "type": "village"}, {"lon": 118.0285, "lat": 24.8135, "zh": "依仁溪", "en": "Yiren Stream", "type": "water"}, {"lon": 118.0185, "lat": 24.834, "zh": "小坪水库", "en": "Xiaoping Reservoir", "type": "water"}]}}, {"id": 9, "num": "⑨", "area_key": "xiangan", "habitat_tag": "coastal", "lon": 118.264625, "lat": 24.560873, "gcj_lon": 118.269335, "gcj_lat": 24.558038, "overview_px": [1347.0, 1223.4], "district_zh": "翔安区", "district_en": "Xiang'an District", "name_zh": "翔安区欧厝—蔡厝滨海滩涂", "name_en": "Oucuo–Caicuo Coastal Mudflats", "short_zh": "欧厝—蔡厝滨海滩涂", "short_en": "Oucuo–Caicuo Mudflats", "habitat_zh": "滨海泥滩 / 潮沟港汊 / 浅海礁石", "habitat_en": "Coastal Mudflats, Tidal Channels & Shallow Reefs", "duration_zh": "单个岸段约 2—3 小时；多点位建议半天", "duration_en": "About 2–3 hours per stretch; half day for multiple sites", "months_zh": "10月—次年5月（白天接近高潮至高潮前后最佳）", "months_en": "Oct–May (best on a rising tide towards high tide)", "difficulty_stars": "★★★☆☆", "difficulty_zh": "★★★☆☆　点位分散，需配合潮汐观察。鸻鹬类距离较远且外形相近，建议携带单筒望远镜；沿岸遮阴和补给较少，请自带饮水。", "difficulty_en": "★★★☆☆ (3/5) Viewpoints are spread out and visits must be timed with the tide. A spotting scope is strongly recommended; bring drinking water.", "summary_zh": "厦门最重要的滨海鸻鹬停歇补给地，常见黄嘴白鹭、小青脚鹬、黑脸琵鹭、黑嘴鸥等国家一级保护鸟类及壮观“鸟浪”。", "summary_en": "Xiamen's premier coastal shorebird mudflats, hosting Class I protected Spoon-billed Sandpiper, Nordmann's Greenshank, Chinese Egret, Black-faced Spoonbill and Saunders's Gull.", "desc_zh": ["翔安东部滨海湿地拥有广阔的滩涂、潮沟和浅海水域，是厦门滨海水鸟重要停歇与补给地。迁徙和越冬季，多种鸻鹬在此集群觅食；黄嘴白鹭、小青脚鹬、黑脸琵鹭、黑嘴鸥等国家一级重点保护鸟类在这一区域常见，并曾记录极危物种勺嘴鹬。片区内还有连片农田与防风林，为小型迁徙鸟类提供停歇空间。", "蔡厝、港汊及大嶝岛周边滩涂湿地是值得关注的观察区域。退潮时，鸻鹬类分散在泥滩和潮沟中觅食；随着潮水上涨，鸟群逐渐向近岸及七星礁等高潮栖息地移动，有时大群水鸟一同飞起，形成壮观的“鸟浪”。"], "desc_en": ["The coastal wetlands of eastern Xiang'an have extensive mudflats, tidal channels and shallow coastal waters, providing critical resting and feeding habitat for Xiamen's coastal waterbirds. Chinese Egret, Nordmann's Greenshank, Black-faced Spoonbill and Saunders's Gull—all Class I nationally protected species—are regularly seen here, alongside records of Critically Endangered Spoon-billed Sandpiper.", "The mudflats around Caicuo, the t         m.classList.toggle('active', Number(m.dataset.id) === id);
      });
      document.querySelectorAll('#spotsTableBody tr').forEach(r => {
        r.classList.toggle('active-row', r.id === `row-${id}`);
      });

      const c = PIN_COLORS[spot.habitat_tag] || '#b5382a';
      const name = isEn ? spot.name_en : spot.name_zh;
      const dist = isEn ? spot.district_en : spot.district_zh;
      const hab = isEn ? spot.habitat_en : spot.habitat_zh;
      const dur = isEn ? spot.duration_en : spot.duration_zh;
      const months = isEn ? spot.months_en : spot.months_zh;
      const descList = isEn ? spot.desc_en : spot.desc_zh;
      const transport = isEn ? spot.transport_en : spot.transport_zh;
      const diff = isEn ? spot.difficulty_en : spot.difficulty_zh;
      const groups = isEn ? spot.bird_groups_en : spot.bird_groups_zh;
      const tips = isEn ? spot.tips_en : spot.tips_zh;

      const localImgSrc = `assets_1110/spot_${spot.id}_${isEn ? 'en' : 'zh'}.png`;

      const subspots = spot.local_map.subspots || [];
      const subspotsNavHtml = subspots.map(sub => {
        const subName = isEn ? sub.en : sub.zh;
        const navUrl = `https://apis.map.qq.com/uri/v1/marker?marker=coord:${sub.gcj_lat},${sub.gcj_lon};title:${encodeURIComponent(name + ' - ' + subName)};addr:${encodeURIComponent('厦门市' + spot.district_zh)}&referer=xmbirds`;
        return `<a class="subspot-nav-pill" href="${navUrl}" target="_blank" rel="noopener">⭕ ${subName} ↗</a>`;
      }).join('');

      const subspotsSvgHits = subspots.filter(sub => Array.isArray(sub.img_px)).map(sub => {
        const subName = isEn ? sub.en : sub.zh;
        const [px, py] = sub.img_px;
        const navUrl = `https://apis.map.qq.com/uri/v1/marker?marker=coord:${sub.gcj_lat},${sub.gcj_lon};title:${encodeURIComponent(name + ' - ' + subName)};addr:${encodeURIComponent('厦门市' + spot.district_zh)}&referer=xmbirds`;
        return `<a class="subspot-hit-link" href="${navUrl}" target="_blank" rel="noopener" title="${subName}">
          <circle class="subspot-hit-circle" cx="${px}" cy="${py}" r="28" />
        </a>`;
      }).join('');

      const groupsHtml = groups.map(g => {
        const chipCls = g.highlight ? 'bird-chip highlight-chip' : 'bird-chip';
        const chips = g.items.map(item => `<span class="${chipCls}">${item}</span>`).join('');
        return `<div class="bird-group-row"><span class="bird-group-label">${g.label}:</span>${chips}</div>`;
      }).join('');

      const qqNavUrl = `https://apis.map.qq.com/uri/v1/marker?marker=coord:${spot.gcj_lat},${spot.gcj_lon};title:${encodeURIComponent(name)};addr:${encodeURIComponent('厦门市' + spot.district_zh)}&referer=xmbirds`;
      const amapNavUrl = `https://uri.amap.com/marker?position=${spot.gcj_lon},${spot.gcj_lat}&name=${encodeURIComponent(name)}`;

      const sheet = document.getElementById('spotSheet');
      sheet.style.borderTopColor = c;
      sheet.innerHTML = `
        <div class="sheet-header">
          <div class="sheet-title-wrap">
            <span class="sheet-num" style="background:${c}">${spot.id}</span>
            <div>
              <h3 class="sheet-title">${name}</h3>
              <span style="font-size:12.5px;color:var(--ink-muted)">${dist} · ${hab}</span>
            </div>
          </div>
          <button class="close-btn" onclick="closeCard()" aria-label="Close">×</button>
        </div>

        <div class="meta-grid">
          <span class="meta-tag">${t.labelDuration}${dur}</span>
          <span class="meta-tag">${t.labelMonths}${months}</span>
        </div>

        <div class="local-map-box">
          <div class="local-map-header">
            <span>${t.localMapTitle}</span>
            <button class="zoom-img-btn" onclick="openLightbox('${localImgSrc}', '${name.replace(/'/g, '')}')">${t.btnZoomLocal}</button>
          </div>
          <div class="local-img-stage">
            <img class="local-spot-img" src="${localImgSrc}" alt="${name}" width="1200" height="800" onclick="openLightbox('${localImgSrc}', '${name.replace(/'/g, '')}')" />
            <svg class="local-subspot-svg" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
              ${subspotsSvgHits}
            </svg>
          </div>
          <div class="subspots-bar">
            <span style="font-size:12px;font-weight:700;color:var(--ink-muted)">${t.subspotsNavLabel}</span>
            ${subspotsNavHtml}
          </div>
        </div>

        <div class="sheet-desc">
          ${descList.map(p => `<p>${p}</p>`).join('')}
        </div>

        <div class="info-block"><strong>${t.labelTransport}</strong>${transport}</div>
        <div class="info-block"><strong>${t.labelDifficulty}</strong>${diff}</div>

        <div style="margin-top:10px">${groupsHtml}</div>

        <div class="sheet-tips"><strong>${t.labelTip}</strong>${tips}</div>

        <div class="sheet-actions">
          <a class="btn-primary" href="${qqNavUrl}" target="_blank" rel="noopener">${t.btnTencent}</a>
          <a class="btn-amap" href="${amapNavUrl}" target="_blank" rel="noopener">${t.btnAmap}</a>
        </div>
      `;

      document.getElementById('cardBackdrop').classList.add('open');
      sheet.classList.add('open');
    }

    function closeCard() {
      currentOpenSpotId = null;
      document.getElementById('cardBackdrop').classList.remove('open');
      document.getElementById('spotSheet').classList.remove('open');
    }

    function setLanguage(lang) {
      currentLang = lang;
      renderHeaderAndMap();
      renderTable();
      if (currentOpenSpotId !== null) {
        selectSpot(currentOpenSpotId);
      }
    }

    renderHeaderAndMap();
    renderTable();
  </script>
</body>
</html>
